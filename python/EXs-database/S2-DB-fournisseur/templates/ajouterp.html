<!DOCTYPE html>
<html lang="en">
<head>
    <title>ajouter produit</title>
</head>
<body>
    <form  method="POST" >
        <label for="nom">Nom:</label>
        <input type="text" id="nom" name="nomp" required><br><br>
        <label for="prix">Prix:</label>
        <input type="text" id="prix" name="prixp" required><br><br>
        <label for="quantite">Quantité:</label>
        <input type="number" id="quantite" name="quantitep" required>
        <label for="fournisseur">Fournisseur:</label>
        <select id="fournisseur" name="idf" required>
            {% for f in nomf %}
                <option value="{{ f[1] }}">{{ f[0] }}</option>
            {% endfor %}
        </select>
        <br><br>
        <input type="submit" value="Ajouter">
    </form>
    
</body>
</html>
